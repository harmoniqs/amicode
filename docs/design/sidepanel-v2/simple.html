<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Now — simple layouts</title>
<link rel="stylesheet" href="mock.css" />
<script src="snapshot.js"></script>
<script src="views.js"></script>
<style>
  /* Three sizes of type, two greys, one red, one yellow button. Nothing else. */
  body { font-size: 13px; line-height: 1.5; }
  .s { max-width: 440px; margin: 0 auto; min-height: 100vh; background: var(--amc-bg); border-inline: 1px solid var(--amc-border); }
  body.inframe .s { max-width: none; border: 0; }
  .tabs2 { display: flex; gap: 20px; padding: 12px 20px 0; border-bottom: 1px solid var(--amc-border); }
  .tabs2 a { padding-bottom: 10px; color: var(--amc-text-muted); text-decoration: none; }
  .tabs2 a.on { color: var(--amc-text); box-shadow: inset 0 -1.5px 0 var(--amc-text); }
  .tabs2 .sp { flex: 1; }
  .pad { padding: 20px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--amc-text-muted); margin-top: 2px; }
  .label { color: var(--amc-text-muted); }
  .big { font-size: 32px; font-weight: 500; letter-spacing: -0.025em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; font-family: inherit; }
  .bad { color: var(--amc-danger); }
  .row { display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--amc-border-muted); }
  .row:first-child { border-top: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row .meta { color: var(--amc-text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row .t { color: var(--amc-text-muted); width: 40px; flex: none; font-variant-numeric: tabular-nums; }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  a.more { color: var(--amc-text-muted); text-decoration: none; }
  a.more:hover { color: var(--amc-text); }
  .sec { margin-top: 28px; }
  .sec > .label { margin-bottom: 4px; }
  .btn2 { font: 500 12px/1 var(--amc-font-sans); height: 28px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--amc-border-strong); background: var(--amc-bg); color: var(--amc-text); cursor: pointer; }
  .btn2.cta { background: var(--amc-accent); color: var(--amc-accent-ink); border-color: var(--amc-accent-edge); }
  .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 16px; }
  .steps i { height: 3px; background: var(--amc-ink-13); }
  .steps i.done { background: var(--amc-text); }
  .steps i.fail { background: var(--amc-danger); }
  .steplabels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 6px; color: var(--amc-text-muted); font-size: 12px; }
  .steplabels span.on { color: var(--amc-text); }
  table.t2 { width: 100%; border-collapse: collapse; }
  table.t2 th { text-align: left; font-weight: 400; color: var(--amc-text-muted); padding: 0 8px 8px 0; border-bottom: 1px solid var(--amc-border); }
  table.t2 td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--amc-border-muted); vertical-align: baseline; }
  table.t2 td.r, table.t2 th.r { text-align: right; padding-right: 0; white-space: nowrap; color: var(--amc-text-muted); }
  .switch { display: inline-flex; align-items: center; gap: 8px; color: var(--amc-text-muted); cursor: pointer; }
  .switch i { width: 26px; height: 14px; border-radius: 999px; background: var(--amc-ink-13); position: relative; }
  .style-switch { display: none !important; }
  .switch i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 10px; height: 10px; border-radius: 999px; background: var(--amc-bg); }
</style>
</head>
<body>
<script>
const { h, usd, dur, ago, clock } = V
V.themeToggle()
document.documentElement.dataset.style = "a"
if (window.top !== window) document.body.classList.add("inframe")
const NOW = Date.parse(SNAP.generated) / 1000
const C = SNAP.campaigns.find((c) => c.slug === "qmotion-autotune")
const run = C.runs[0]
const L = C.ledger
const layout = new URLSearchParams(location.search).get("layout") || "focus"

const phases = run.tags.phase.map((p) => p.split("|"))
const [spent, cap] = run.tags.cost[0].split("|").map(Number)
const draws = run.series[run.series.length - 1].i
const fail = run.tags.gate.map((g) => g.split("|")).find(([, v]) => /FAIL/.test(v))
const confirmed = L.hypotheses.filter((x) => x.cls === "confirmed").length
const llm = C.director_usd + Object.values(C.by_role).reduce((a, r) => a + r.usd, 0)
const last = C.recent[0]
const hhmm = (t) => {
  if (t == null) return ""
  const d = new Date(t * 1000)
  if (NOW - t > 20 * 3600) return d.toLocaleDateString("en-US", { month: "short", day: "numeric" })
  return d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: false })
}

const page = h("div", { class: "s" },
  h("nav", { class: "tabs2" }, h("a", { class: "on" }, "Now"), h("a", null, "Files"), h("a", null, "Context"), h("span", { class: "sp" }), h("a", null, "Home")),
)
document.body.append(page)
const body = h("div", { class: "pad" })
page.append(body)
const header = () => [h("h1", null, C.title), h("div", { class: "sub" }, "Director running · updated " + ago(run.t1, NOW))]
const watch = () => h("label", { class: "switch" }, h("i"), "Watch this campaign")

/* ── 1 · Focus: one thing big, everything else one line ───────────────── */
if (layout === "focus") {
  body.append(
    ...header(),
    h("div", { class: "sec" },
      h("div", { class: "label" }, "Freeze run r10 · running " + dur(NOW - run.t0)),
      h("div", { class: "big", style: { marginTop: "6px" } }, draws.toLocaleString("en-US"), h("span", { class: "label", style: { fontSize: "13px", fontWeight: 400, letterSpacing: 0 } }, "  draws")),
      h("div", { class: "steps" }, phases.map(([, st]) => h("i", { class: st === "done" ? "done" : st === "failed" ? "fail" : "" }))),
      h("div", { class: "steplabels" }, phases.map(([id, st]) => h("span", { class: st === "failed" ? "bad" : st === "done" ? "on" : "" }, id))),
      h("p", { style: { margin: "16px 0 0" } }, h("span", { class: "bad" }, "Held-out oracle failed: "), fail[1].replace("FAIL ", "") + ". Thresholds and the dev gate are waiting on it."),
      h("div", { style: { display: "flex", gap: "8px", marginTop: "12px" } }, h("button", { class: "btn2 cta" }, "Open run"), h("button", { class: "btn2" }, "Ask about it")),
    ),
    h("div", { class: "sec" },
      [
        ["Campaign", `${L.hypotheses.length} hypotheses, ${confirmed} confirmed`],
        ["Last cast", `${last.title}`],
        ["Spend", `${usd(llm, 0)} model · ${usd(spent)} Modal`],
      ].map(([k, v]) => h("a", { class: "row more", href: "#" }, h("span", { style: { width: "84px", flex: "none" } }, k), h("span", { class: "grow ell", style: { color: "var(--amc-text)" } }, v), h("span", null, "›"))),
    ),
    h("div", { class: "sec" }, watch()),
  )
}

/* ── 2 · Feed: what happened, newest first ─────────────────────────────── */
if (layout === "feed") {
  const items = [
    { t: null, text: [h("span", { class: "bad" }, "Gate failed"), " · held-out oracle, TRUE class pruned"], meta: "Open", act: true },
    ...C.recent.slice(0, 5).map((k) => ({ t: k.end, text: [k.title.replace(/^(\w+):\s*/, "$1 · ")], meta: usd(k.usd, 0) })),
    { t: run.t0, text: ["Freeze run r10 started"], meta: "" },
  ]
  body.append(
    ...header(),
    h("div", { class: "sec" },
      h("div", { class: "label" }, "Freeze run r10"),
      h("div", { style: { marginTop: "2px" } }, `${draws.toLocaleString("en-US")} draws · ${usd(spent)} of ${usd(cap, 0)} · held-out oracle `, h("span", { class: "bad" }, "failed")),
    ),
    h("div", { class: "sec" },
      h("div", { class: "label" }, "Activity"),
      items.map((x) => h("div", { class: "row" }, h("span", { class: "t" }, hhmm(x.t)), h("span", { class: "grow ell" }, x.text), x.act ? h("button", { class: "btn2" }, "Open") : h("span", { class: "meta" }, x.meta))),
    ),
    h("div", { class: "sec" }, h("a", { class: "more", href: "#" }, `All ${C.casts} casts and ${L.hypotheses.length} hypotheses ›`)),
    h("div", { class: "sec" }, watch()),
  )
}

/* ── 3 · Table: every object, one row ──────────────────────────────────── */
if (layout === "table") {
  const rows = [
    ["Freeze run r10", "Running", `${draws.toLocaleString("en-US")} draws`, ago(run.t1, NOW).replace(" ago", "")],
    ["Held-out oracle", h("span", { class: "bad" }, "Failed"), "60/61, TRUE pruned", ""],
    ["Thresholds", "Waiting", "on the oracle", ""],
    ["Campaign", "Active", `${confirmed} of ${L.hypotheses.length} confirmed`, ago(L.mtime, NOW).replace(" ago", "")],
    ["Last cast", "Done", last.title.replace(/^\w+:\s*/, ""), ago(last.end, NOW).replace(" ago", "")],
    ["Spend", "", `${usd(llm, 0)} model · ${usd(spent)} Modal`, ""],
    ["Watcher", "Off", h("a", { class: "more", href: "#" }, "Start"), ""],
  ]
  body.append(
    ...header(),
    h("div", { class: "sec" },
      h("table", { class: "t2" },
        h("thead", null, h("tr", null, h("th", null, ""), h("th", null, "State"), h("th", null, "Detail"), h("th", { class: "r" }, "Updated"))),
        h("tbody", null, rows.map(([a, b, c, d]) => h("tr", null, h("td", { style: { fontWeight: 500, whiteSpace: "nowrap" } }, a), h("td", { style: { whiteSpace: "nowrap" } }, b), h("td", { class: "ell", style: { maxWidth: "0", width: "60%" } }, c), h("td", { class: "r" }, d)))),
      ),
    ),
  )
}
</script>
</body>
</html>
