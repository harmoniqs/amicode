name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # version pinned by packageManager in package.json
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - run: pnpm -r run typecheck
      # Fetch the vendored opencode BEFORE vitest so the OC_BIN-gated integration
      # test (opencode config injection + merge) actually RUNS in CI instead of
      # self-skipping — the skip was the #25 CI-level false-green (an injection or
      # config-merge regression would pass CI because the only test for it skipped).
      - run: pnpm --filter amicode-v2 fetch:opencode
        env:
          # gh release download pulls the vendored binary from the PRIVATE
          # harmoniqs/opencode release; the default GITHUB_TOKEN is scoped to
          # this repo only, so gh needs a cross-repo token (repo secret).
          GH_TOKEN: ${{ secrets.OPENCODE_FETCH_TOKEN }}
      - run: pnpm -r run test   # amico-run suite (incl. S31 grep rule) + extension unit suite (incl. the opencode inject/merge integration) + @amicode/schema conformance
      - name: amico-validate — shipped configs conform + linked bin works (0.1c gate)
        run: |
          # Exercise the LINKED bin via a dependent (the bin links into amico-run /
          # extension, not the root) so a broken bin entry reds. (Jack's #30.)
          pnpm --filter amicode-v2 exec amico-validate --help
          # File validations via the launcher (root-relative paths, real bin target).
          V="packages/schema/launcher/amico-validate"
          $V packages/extension/scripts/lab.toml.example --schema lab
          $V packages/extension/demo/run/run.toml
          $V packages/extension/demo/run/result.toml
          $V packages/extension/demo/run/FINISHED
          # the non-filename schemas (AC5: all five) via --schema
          $V packages/schema/test/fixtures/valid/solvespec.toml --schema solvespec
          $V packages/schema/test/fixtures/valid/catalog-entry.toml --schema catalog-entry
  schema-roundtrip:
    # 0.1d: the Julia round-trip against the SAME packages/schema/schemas/*.json the
    # TS side uses (cross-language anti-drift). Fast tier — JSONSchema only, NO Piccolo
    # solve. Three lanes: (1) golden + negative fixtures, (2) a REAL producer lane
    # (amico-run emits a run-dir → validate it — exercises the producer, not just
    # fixtures), (3) AC6 drift check (perturb the shared schema → BOTH TS and Julia flip).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: pnpm }
      - uses: julia-actions/setup-julia@v3
        with: { version: '1.12' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build   # amico-run + the validate launcher's bundle
      - run: julia --project=packages/schema/julia -e 'using Pkg; Pkg.instantiate()'
      - name: round-trip (golden + negative fixtures)
        run: julia --project=packages/schema/julia packages/schema/julia/runtests.jl
      - name: producer lane — amico-run emits a run-dir, Julia validates the emitted output
        run: bash packages/schema/scripts/producer_roundtrip.sh
      - name: AC6 anti-drift — perturbing the shared schema flips BOTH TS and Julia
        run: bash packages/schema/scripts/ac6_drift_check.sh
  vsix-gate:
    # 1.4 (#45): build the REAL .vsix and run the packaging-manifest suite with
    # AMICODE_REQUIRE_VSIX=1 — under that flag the suite can never self-skip, so
    # a dropped runtime asset (or a package step that stops producing the file)
    # reds CI instead of riding the perennial "2 skip" false-green. ubuntu-only:
    # VSIX contents are platform-independent except the vendored opencode dir,
    # and the manifest check accepts any platform there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build   # amico-run + extension (same as fast — ensures dist/ is in place before vsce)
      # Vendor BOTH platform binaries so the packaged .vsix installs on linux-x64 AND
      # darwin-arm64. The runner only fetches its own platform by default; darwin is a
      # cross-platform fetch, so force --release (a local build can only emit the host arch).
      - run: pnpm --filter amicode-v2 fetch:opencode   # native (linux-x64)
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_FETCH_TOKEN }}   # private-fork release fetch (see fast)
      - run: node packages/extension/scripts/fetch_opencode.mjs --platform darwin-arm64 --release
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_FETCH_TOKEN }}
      # Fail closed if EITHER binary is absent (a silently no-op'd cross-platform fetch would
      # otherwise ship a single-platform .vsix that still passes the any-platform manifest gate)
      # or hides the amicode UI (built OPENCODE_CHANNEL=latest/prod). Same gate release.yml enforces.
      - run: |
          bash packages/extension/scripts/assert_ui_gate.sh packages/extension/vendor/opencode/linux-x64/opencode
          bash packages/extension/scripts/assert_ui_gate.sh packages/extension/vendor/opencode/darwin-arm64/opencode
      - run: pnpm --filter amicode-v2 exec vsce package --no-dependencies --allow-missing-repository -o amicode.vsix
      - run: AMICODE_REQUIRE_VSIX=1 pnpm --filter amicode-v2 exec vitest run test/packaging.test.ts
      # The installable artifact: a cross-platform .vsix downloadable from every CI run.
      - name: Upload amicode.vsix
        uses: actions/upload-artifact@v4
        with:
          name: amicode-vsix
          path: packages/extension/amicode.vsix
          if-no-files-found: error
  boot-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]   # linux-x64 + darwin-arm64 — both pins machine-gated (spec §5)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter amicode-v2 fetch:opencode
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_FETCH_TOKEN }}   # private-fork release fetch (see fast); one step covers both matrix legs
      - run: pnpm --filter amicode-v2 test:smoke
