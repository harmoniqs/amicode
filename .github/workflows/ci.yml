name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  # ── Build the opencode binary from the materialized overlay tree ───────────
  # Single job, all 3 platforms via bun cross-compilation (S3 proven).
  # Every binary-consuming job declares needs: [build-binary] and downloads
  # the shared artifact — no job compiles independently (#1096).
  build-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - name: Build native binary (linux-x64)
        run: node packages/extension/scripts/build_binary.mjs
      - name: Cross-compile remaining platforms
        run: |
          for P in linux-arm64 darwin-arm64; do
            node packages/extension/scripts/build_binary.mjs --platform "$P"
          done
      - name: Upload vendor/opencode (all platforms)
        uses: actions/upload-artifact@v7
        with:
          name: opencode-binaries
          path: packages/extension/vendor/opencode/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  # ── app-bundle provenance gate ─────────────────────────────────────────────
  # Verifies the committed overlay is in sync. Post-S4: the provenance check
  # verifies lock.version matches the baked OPENCODE_VERSION and the
  # upstream_base_sha matches the materialized base. No fork clone needed.
  app-bundle-gate:
    runs-on: ubuntu-latest
    needs: [build-binary]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          name: opencode-binaries
          path: packages/extension/vendor/opencode
      - name: Restore binary permissions
        run: chmod +x packages/extension/vendor/opencode/*/opencode
      - name: Provenance — lock.version matches baked OPENCODE_VERSION
        run: |
          LOCK_VERSION="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("packages/extension/opencode.lock.json","utf8")).version)')"
          BI="packages/extension/vendor/opencode/linux-x64/.buildinfo"
          test -f "$BI" || { echo "FAIL: no .buildinfo"; exit 1; }
          BAKED_VERSION="$(grep '^OPENCODE_VERSION=' "$BI" | cut -d= -f2)"
          if [ "$LOCK_VERSION" != "$BAKED_VERSION" ]; then
            echo "FAIL: lock.version=$LOCK_VERSION but .buildinfo OPENCODE_VERSION=$BAKED_VERSION"
            exit 1
          fi
          echo "OK: lock.version ($LOCK_VERSION) matches baked OPENCODE_VERSION"
      - name: Provenance — upstream_base_sha matches the materialized base
        run: |
          MANIFEST_BASE="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("packages/app-bundle/manifest.json","utf8")).upstream_base_sha)')"
          echo "manifest upstream_base_sha: $MANIFEST_BASE"
          # The overlay is committed; if it were stale the drift gate would catch it.
          # Here we verify the manifest's base SHA is a valid commit-like reference.
          test -n "$MANIFEST_BASE" || { echo "FAIL: manifest has no upstream_base_sha"; exit 1; }
          echo "OK: upstream_base_sha is recorded ($MANIFEST_BASE)"
      - name: drift gate — overlay/manifest sync (committed state)
        run: node packages/app-bundle/scripts/drift_gate.mjs
  bundle-build-gate:
    # #643: the CLI bundles (packages/amico-run/dist/*.js) are gitignored build
    # artifacts — the deployed verb-router bundle sat 46 days stale because
    # nothing gated the build. This lane builds every declared bundle from
    # current source on every push/PR: a broken entry or unresolvable import
    # fails the build step (esbuild exits non-zero), and a build that silently
    # drops or truncates a bundle reds the assert step, which also smoke-runs
    # the built verb router (--help must exit 0) — the vitest suite transpiles
    # and never executes the shipped artifact, so this is where a
    # builds-but-dies bundle is caught.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # version pinned by packageManager in package.json
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @amicode/amico-run build
      - name: bundle-gate — every declared bundle built + the verb-router smoke answers (#643)
        run: node packages/amico-run/scripts/assert_built_bundles.mjs
  fast:
    runs-on: ubuntu-latest
    needs: [build-binary]
    steps:
      - uses: actions/checkout@v7
        # full history: the #1346 additive-invariants-gate diffs the enroll/guard
        # set vs `git merge-base HEAD <base>` — a shallow (depth-1) checkout has no
        # common ancestor, so the merge-base is empty and the gate (correctly)
        # refuses to pass an UNVERIFIABLE AC1 under INVARIANT_STRICT=1. Full history
        # lets it actually verify. (#1346)
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6   # version pinned by packageManager in package.json
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      # #161 behavioral packaging gate, source-staged lane: the extension build
      # above stages every bin the CLI package DECLARES (bin-map-driven) into
      # packages/extension/bin — assert hermetically (scratch HOME, no cloud,
      # no network) that each staged bin exists, is executable, does NOT die
      # with the unknown-executor rejection on a remote invocation (the
      # stale-bundle signature), and lists `remote` in its usage. A declared-
      # but-missing bin reds. Scoped to the CLI bins only: the vendored
      # opencode binary is gated separately via build-binary + assert_ui_gate.
      - name: cli-gate — staged CLI accepts the remote executor, every declared bin present (#161)
        run: node packages/extension/scripts/assert_packaged_cli.mjs
      - name: fleet-gate — guard + tunnel template sane (#324)
        run: bash packages/extension/scripts/assert_fleet_guard.sh
      - name: additive-invariants-gate — peer studios stay additive (ADR 0027, #1346)
        env:
          INVARIANT_STRICT: "1" # CI must be able to verify AC1 — an unverifiable base is a hard fail
        run: |
          # AC1 diffs the enroll/guard set vs the MERGE-BASE with the base branch.
          # A shallow checkout may not carry the base branch, so fetch it here —
          # this also persists the ref for the later vitest subprocess in the
          # `pnpm -r run test` step, which runs the same gate.
          git fetch --no-tags --quiet origin "${GITHUB_BASE_REF:-feature/free-tier-fleet}" || true
          bash packages/extension/scripts/assert_additive_invariants.sh
      # Pasqal python provisioning gate, source lane: the SHIPPED connector
      # assets must provision a working interpreter (real venv + pip + SDK
      # import at the pinned version + validator env-guard smoke). Guards the
      # fresh-install bug class: requirements that don't install the SDK the
      # validator needs. Needs PyPI; the exact == pin keeps it deterministic.
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: provisioning-gate — shipped connector assets provision a working interpreter (pasqal python provisioning)
        run: node packages/extension/scripts/assert_provisioned_python.mjs
      - run: pnpm -r run typecheck
      # Download the built binary so the OC_BIN-gated integration test
      # (opencode config injection + merge) actually RUNS in CI instead of
      # self-skipping — the skip was the #25 CI-level false-green.
      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          name: opencode-binaries
          path: packages/extension/vendor/opencode
      - name: Restore binary permissions
        run: chmod +x packages/extension/vendor/opencode/*/opencode
      - run: pnpm -r run test   # amico-run suite (incl. S31 grep rule) + extension unit suite (incl. the opencode inject/merge integration) + @amicode/schema conformance
      - name: amico-validate — shipped configs conform + linked bin works (0.1c gate)
        run: |
          # Exercise the LINKED bin via a dependent (the bin links into amico-run /
          # extension, not the root) so a broken bin entry reds. (Jack's #30.)
          pnpm --filter amicode exec amico-validate --help
          # File validations via the launcher (root-relative paths, real bin target).
          V="packages/schema/launcher/amico-validate"
          $V packages/extension/scripts/lab.toml.example --schema lab
          $V packages/extension/demo/run/run.toml
          $V packages/extension/demo/run/result.toml
          $V packages/extension/demo/run/FINISHED
          # the non-filename schemas (AC5: all five) via --schema
          $V packages/schema/test/fixtures/valid/solvespec.toml --schema solvespec
          $V packages/schema/test/fixtures/valid/catalog-entry.toml --schema catalog-entry
          # the shipped pack manifest (WS1 #369) — kinded by filename (PACK.toml),
          # so this also exercises the kindForFilename mapping.
          $V packages/extension/packs/quantum-control/PACK.toml
          # ledger-record (Plan 3 / L1 Task 9): oneOf-on-`type`, JSON on disk (JSONL
          # lines in the real ~/.amico/ledger/runs.jsonl) — validateFile parses by
          # .json extension, not TOML.
          $V packages/schema/test/fixtures/valid/ledger-record.json --schema ledger-record
  schema-roundtrip:
    # 0.1d: the Julia round-trip against the SAME packages/schema/schemas/*.json the
    # TS side uses (cross-language anti-drift). Fast tier — JSONSchema only, NO Piccolo
    # solve. Lanes: (1) golden + negative fixtures INCL. the problemspec dual-validation
    # sweep (ajv == JSONSchema.jl accept/reject on every valid/invalid problemspec
    # fixture, runtests.jl); (2) a REAL producer lane (amico-run emits a run-dir →
    # validate it); (3) AC6 drift check — perturb the shared schema (run AND problemspec
    # cases) → BOTH TS and Julia flip; (4) cross-repo vendoring-drift — the vendored
    # problemspec schemas byte-match the pinned Piccolo/Piccolissimo emission (Task 9).
    # NOTE: the TS canonical-JSON/hash vitest runs in the `fast` job (pnpm -r run test),
    # not here — this job is the Julia fixture lane + drift gates only (plan note 11).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - uses: julia-actions/setup-julia@v3
        with: { version: '1.12' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build   # amico-run + the validate launcher's bundle
      - run: julia --project=packages/schema/julia -e 'using Pkg; Pkg.instantiate()'
      - name: round-trip (golden + negative fixtures)
        run: julia --project=packages/schema/julia packages/schema/julia/runtests.jl
      - name: producer lane — amico-run emits a run-dir, Julia validates the emitted output
        run: bash packages/schema/scripts/producer_roundtrip.sh
      - name: AC6 anti-drift — perturbing the shared schema flips BOTH TS and Julia (run + problemspec)
        run: bash packages/schema/scripts/ac6_drift_check.sh
      # Task 9 cross-repo vendoring-drift: the vendored problemspec schemas must be
      # byte-identical to the schema the pinned Piccolo/Piccolissimo commit emitted
      # (git-fetch at the *.sha sidecar's sha + cmp — NEVER re-run regenerate.jl here,
      # correction #1). The OSS variant is checked against public Piccolo tokenlessly;
      # a reachable-but-differing source reds CI. The FULL variant (private
      # Piccolissimo) is checked only when PICCOLISSIMO_SCHEMA_TOKEN is set — its
      # authoritative drift gate lives in Piccolissimo's own private CI, so amicode CI
      # carries no mandatory private dependency (correction #1).
      - name: vendoring-drift — vendored problemspec schemas byte-match the pinned Piccolo/Piccolissimo source
        run: bash packages/schema/scripts/vendoring_drift_check.sh
        env:
          PICCOLISSIMO_SCHEMA_TOKEN: ${{ secrets.PICCOLISSIMO_SCHEMA_TOKEN }}
  vsix-gate:
    # 1.4 (#45): build the REAL .vsix and run the packaging-manifest suite with
    # AMICODE_REQUIRE_VSIX=1 — under that flag the suite can never self-skip, so
    # a dropped runtime asset (or a package step that stops producing the file)
    # reds CI instead of riding the perennial "2 skip" false-green. ubuntu-only:
    # VSIX contents are platform-independent except the vendored opencode dir,
    # and the manifest check accepts any platform there.
    runs-on: ubuntu-latest
    needs: [build-binary]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      # Download pre-built binaries (#1096)
      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          name: opencode-binaries
          path: packages/extension/vendor/opencode
      - name: Restore binary permissions
        run: chmod +x packages/extension/vendor/opencode/*/opencode
      # Build the .vsix via the SAME recipe release.yml ships — `pnpm run package`
      # now invokes build:binary (which finds the already-placed vendor/ binaries
      # and skips the build). The vsix packs the host binary; cross-platform
      # binaries are already downloaded above.
      - run: pnpm --filter @amicode/amico-run build && pnpm --filter amicode run build && pnpm --filter amicode run build:exemplars && pnpm --filter amicode run build:app
      # Fail closed if ANY binary is absent or hides the amicode UI
      # (built OPENCODE_CHANNEL=latest/prod). Same gate release.yml enforces.
      - run: |
          for P in linux-x64 linux-arm64 darwin-arm64; do
            bash packages/extension/scripts/assert_ui_gate.sh "packages/extension/vendor/opencode/$P/opencode"
          done
      - run: pnpm --filter amicode exec vsce package --no-dependencies --allow-missing-repository -o amicode.vsix
      - run: AMICODE_REQUIRE_VSIX=1 pnpm --filter amicode exec vitest run test/packaging.test.ts
      # #161 behavioral packaging gate, artifact lane: unzip the REAL .vsix and
      # run the same per-declared-bin behavioral checks against the extracted
      # bin dir — a stale bundle that slipped into the package (the shipped
      # regression this issue exists for), a dropped bin, or a lost exec bit
      # all red here, on the artifact itself rather than the workspace staging.
      - name: cli-gate — the .vsix's bundled CLI accepts the remote executor (#161)
        run: |
          rm -rf /tmp/amicode-vsix-gate && mkdir -p /tmp/amicode-vsix-gate
          unzip -q packages/extension/amicode.vsix -d /tmp/amicode-vsix-gate
          node packages/extension/scripts/assert_packaged_cli.mjs --bin-dir /tmp/amicode-vsix-gate/extension/bin
      # Pasqal python provisioning gate, artifact lane: the SAME provisioning
      # checks against the connector assets unzipped from the real .vsix — a
      # vsix that shipped a stale/unpinned requirements.txt reds here, on the
      # artifact itself, before any release can carry it.
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: provisioning-gate — the .vsix's connector assets provision a working interpreter (pasqal python provisioning)
        run: node packages/extension/scripts/assert_provisioned_python.mjs --assets-dir /tmp/amicode-vsix-gate/extension/scripts/pasqal-connector
      # The installable artifact: a cross-platform .vsix downloadable from every CI run.
      - name: Upload amicode.vsix
        uses: actions/upload-artifact@v7
        with:
          name: amicode-vsix
          path: packages/extension/amicode.vsix
          if-no-files-found: error
  app-shelf-boot-proof:
    # #822 the env-gated LIVE boot proof lane (the telaio_app_probe precedent).
    runs-on: ubuntu-latest
    needs: [build-binary]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          name: opencode-binaries
          path: packages/extension/vendor/opencode
      - name: Restore binary permissions
        run: chmod +x packages/extension/vendor/opencode/*/opencode
      - name: boot proof — real service + real engine + real dist (self-skips until the dist-build chore lands)
        run: AMICODE_APP_DIST=${AMICODE_APP_DIST:-} node packages/extension/scripts/amicode_service_boot_probe.mjs
  boot-smoke:
    needs: [build-binary]
    strategy:
      matrix:
        # linux-x64 + linux-arm64 + darwin-arm64 — every pin machine-gated (spec §5).
        # ubuntu-24.04-arm is the free GitHub-hosted arm runner (public repo), and it
        # is the ONLY place a linux-arm64 binary is executed.
        # macos-14 boot-smoke: the binary is cross-compiled from linux; native
        # execution on macOS is the safety net.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          name: opencode-binaries
          path: packages/extension/vendor/opencode
      - name: Restore binary permissions
        run: chmod +x packages/extension/vendor/opencode/*/opencode
      - run: pnpm --filter amicode test:smoke
  engine-tests:
    # #1228: restore engine typecheck coverage the fork-absorption (#1114) dropped.
    # The overlay engine (packages/app-bundle/overlay/packages/opencode) is NOT a
    # pnpm workspace member (pnpm-workspace.yaml globs packages/* non-recursively),
    # so the `fast` job's `pnpm -r run typecheck` skips it entirely — engine type
    # regressions merged unseen (this gate's first catch: the src/session/lineage.ts
    # SessionID predicate bug that was live on dev). This lane materializes the full
    # engine tree and runs the opencode package typecheck — the fork's typecheck.yml
    # (`bun turbo typecheck`), scoped to the engine — plus the unit-test suite.
    # New type errors fail CI; three known base-drift errors are allowlisted in the
    # typecheck gate and tracked in #1229. The #1233 unit lane runs the fork-style
    # shared-process suite but is non-blocking until #1239 hardens it. test:httpapi
    # and check:generated remain follow-ups.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - name: Materialize the full engine tree (canonical base + overlay)
        run: pnpm --filter @amicode/app-bundle run materialize
      - name: bun install (materialized tree deps)
        run: cd packages/app-bundle/.materialized && bun install --ignore-scripts
      - name: Engine typecheck gate (opencode) — new errors fail; base-drift (#1229) allowlisted
        run: bash packages/app-bundle/scripts/engine_typecheck_gate.sh
      # #1348: the engine gate covers only `opencode`, but the overlay also
      # modifies app/ui/session-ui/core/schema/sdk/llm — none reached by the
      # engine gate or the fast job's `pnpm -r run typecheck` (the overlay is
      # not a pnpm workspace member). This gate typechecks them all in the same
      # materialized tree. No allowlist — #1348 fixed all nine pre-existing
      # base-drift errors, so ANY type error in a covered package fails CI.
      - name: Overlay typecheck gate (app, ui, session-ui, core, schema, sdk, llm) — fail-closed, no allowlist (#1348)
        run: bash packages/app-bundle/scripts/overlay_typecheck_gate.sh
      # Non-blocking until #1239 fixes suite pollution, timing flakiness, and
      # positive cross-test dependencies. It still runs the overlay suite and
      # reports the result on every PR; drop continue-on-error to promote it.
      - name: Engine unit-test lane (opencode) — non-blocking (#1233, #1239)
        continue-on-error: true
        run: bash packages/app-bundle/scripts/engine_test_gate.sh
