name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # version pinned by packageManager in package.json
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      # #161 behavioral packaging gate, source-staged lane: the extension build
      # above stages every bin the CLI package DECLARES (bin-map-driven) into
      # packages/extension/bin — assert hermetically (scratch HOME, no cloud,
      # no network) that each staged bin exists, is executable, does NOT die
      # with the unknown-executor rejection on a remote invocation (the
      # stale-bundle signature), and lists `remote` in its usage. A declared-
      # but-missing bin reds. Scoped to the CLI bins only: fetch:opencode /
      # fetch:skills pull from PRIVATE releases (need OPENCODE_FETCH_TOKEN),
      # and the vendored opencode is not what #161 gates. The vsix-gate job
      # runs the SAME script against the bins extracted from the real .vsix.
      - name: cli-gate — staged CLI accepts the remote executor, every declared bin present (#161)
        run: node packages/extension/scripts/assert_packaged_cli.mjs
      # Pasqal python provisioning gate, source lane: the SHIPPED connector
      # assets must provision a working interpreter (real venv + pip + SDK
      # import at the pinned version + validator env-guard smoke). Guards the
      # fresh-install bug class: requirements that don't install the SDK the
      # validator needs. Needs PyPI; the exact == pin keeps it deterministic.
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: provisioning-gate — shipped connector assets provision a working interpreter (pasqal python provisioning)
        run: node packages/extension/scripts/assert_provisioned_python.mjs
      - run: pnpm -r run typecheck
      # Fetch the vendored opencode BEFORE vitest so the OC_BIN-gated integration
      # test (opencode config injection + merge) actually RUNS in CI instead of
      # self-skipping — the skip was the #25 CI-level false-green (an injection or
      # config-merge regression would pass CI because the only test for it skipped).
      - run: pnpm --filter amicode fetch:opencode
        env:
          # gh release download pulls the vendored binary from the PRIVATE
          # harmoniqs/opencode release; the default GITHUB_TOKEN is scoped to
          # this repo only, so gh needs a cross-repo token (repo secret).
          GH_TOKEN: ${{ secrets.OPENCODE_FETCH_TOKEN }}
      - run: pnpm -r run test   # amico-run suite (incl. S31 grep rule) + extension unit suite (incl. the opencode inject/merge integration) + @amicode/schema conformance
      - name: amico-validate — shipped configs conform + linked bin works (0.1c gate)
        run: |
          # Exercise the LINKED bin via a dependent (the bin links into amico-run /
          # extension, not the root) so a broken bin entry reds. (Jack's #30.)
          pnpm --filter amicode exec amico-validate --help
          # File validations via the launcher (root-relative paths, real bin target).
          V="packages/schema/launcher/amico-validate"
          $V packages/extension/scripts/lab.toml.example --schema lab
          $V packages/extension/demo/run/run.toml
          $V packages/extension/demo/run/result.toml
          $V packages/extension/demo/run/FINISHED
          # the non-filename schemas (AC5: all five) via --schema
          $V packages/schema/test/fixtures/valid/solvespec.toml --schema solvespec
          $V packages/schema/test/fixtures/valid/catalog-entry.toml --schema catalog-entry
          # ledger-record (Plan 3 / L1 Task 9): oneOf-on-`type`, JSON on disk (JSONL
          # lines in the real ~/.amico/ledger/runs.jsonl) — validateFile parses by
          # .json extension, not TOML.
          $V packages/schema/test/fixtures/valid/ledger-record.json --schema ledger-record
  schema-roundtrip:
    # 0.1d: the Julia round-trip against the SAME packages/schema/schemas/*.json the
    # TS side uses (cross-language anti-drift). Fast tier — JSONSchema only, NO Piccolo
    # solve. Lanes: (1) golden + negative fixtures INCL. the problemspec dual-validation
    # sweep (ajv == JSONSchema.jl accept/reject on every valid/invalid problemspec
    # fixture, runtests.jl); (2) a REAL producer lane (amico-run emits a run-dir →
    # validate it); (3) AC6 drift check — perturb the shared schema (run AND problemspec
    # cases) → BOTH TS and Julia flip; (4) cross-repo vendoring-drift — the vendored
    # problemspec schemas byte-match the pinned Piccolo/Piccolissimo emission (Task 9).
    # NOTE: the TS canonical-JSON/hash vitest runs in the `fast` job (pnpm -r run test),
    # not here — this job is the Julia fixture lane + drift gates only (plan note 11).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: pnpm }
      - uses: julia-actions/setup-julia@v3
        with: { version: '1.12' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build   # amico-run + the validate launcher's bundle
      - run: julia --project=packages/schema/julia -e 'using Pkg; Pkg.instantiate()'
      - name: round-trip (golden + negative fixtures)
        run: julia --project=packages/schema/julia packages/schema/julia/runtests.jl
      - name: producer lane — amico-run emits a run-dir, Julia validates the emitted output
        run: bash packages/schema/scripts/producer_roundtrip.sh
      - name: AC6 anti-drift — perturbing the shared schema flips BOTH TS and Julia (run + problemspec)
        run: bash packages/schema/scripts/ac6_drift_check.sh
      # Task 9 cross-repo vendoring-drift: the vendored problemspec schemas must be
      # byte-identical to the schema the pinned Piccolo/Piccolissimo commit emitted
      # (git-fetch at the *.sha sidecar's sha + cmp — NEVER re-run regenerate.jl here,
      # correction #1). The OSS variant is checked against public Piccolo tokenlessly;
      # a reachable-but-differing source reds CI. The FULL variant (private
      # Piccolissimo) is checked only when PICCOLISSIMO_SCHEMA_TOKEN is set — its
      # authoritative drift gate lives in Piccolissimo's own private CI, so amicode CI
      # carries no mandatory private dependency (correction #1).
      - name: vendoring-drift — vendored problemspec schemas byte-match the pinned Piccolo/Piccolissimo source
        run: bash packages/schema/scripts/vendoring_drift_check.sh
        env:
          PICCOLISSIMO_SCHEMA_TOKEN: ${{ secrets.PICCOLISSIMO_SCHEMA_TOKEN }}
  vsix-gate:
    # 1.4 (#45): build the REAL .vsix and run the packaging-manifest suite with
    # AMICODE_REQUIRE_VSIX=1 — under that flag the suite can never self-skip, so
    # a dropped runtime asset (or a package step that stops producing the file)
    # reds CI instead of riding the perennial "2 skip" false-green. ubuntu-only:
    # VSIX contents are platform-independent except the vendored opencode dir,
    # and the manifest check accepts any platform there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Build the .vsix via the SAME recipe release.yml ships — `pnpm run package`
      # (build + exemplars + fetch:opencode linux-x64 + fetch:skills + vsce). One
      # build definition, so the gate tests the real release artifact and there's
      # nothing to keep in sync by hand (the drift trap this job used to be).
      # NOTE: this token must ALSO have read access to harmoniqs/amico-plugin
      # releases (fetch:skills) — if OPENCODE_FETCH_TOKEN is scoped only to the
      # opencode fork, broaden it or add a dedicated SKILLS_FETCH_TOKEN secret.
      - run: pnpm --filter amicode run package
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_FETCH_TOKEN }}
      # package only vendors the host binary (linux-x64); add darwin-arm64 so the
      # gated .vsix is cross-platform, then repackage. --release: a cross-platform
      # fetch can't build the non-host arch locally.
      - run: node packages/extension/scripts/fetch_opencode.mjs --platform darwin-arm64 --release
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_FETCH_TOKEN }}
      # Fail closed if EITHER binary is absent (a silently no-op'd cross-platform fetch would
      # otherwise ship a single-platform .vsix that still passes the any-platform manifest gate)
      # or hides the amicode UI (built OPENCODE_CHANNEL=latest/prod). Same gate release.yml enforces.
      - run: |
          bash packages/extension/scripts/assert_ui_gate.sh packages/extension/vendor/opencode/linux-x64/opencode
          bash packages/extension/scripts/assert_ui_gate.sh packages/extension/vendor/opencode/darwin-arm64/opencode
      - run: pnpm --filter amicode exec vsce package --no-dependencies --allow-missing-repository -o amicode.vsix
      - run: AMICODE_REQUIRE_VSIX=1 pnpm --filter amicode exec vitest run test/packaging.test.ts
      # #161 behavioral packaging gate, artifact lane: unzip the REAL .vsix and
      # run the same per-declared-bin behavioral checks against the extracted
      # bin dir — a stale bundle that slipped into the package (the shipped
      # regression this issue exists for), a dropped bin, or a lost exec bit
      # all red here, on the artifact itself rather than the workspace staging.
      - name: cli-gate — the .vsix's bundled CLI accepts the remote executor (#161)
        run: |
          rm -rf /tmp/amicode-vsix-gate && mkdir -p /tmp/amicode-vsix-gate
          unzip -q packages/extension/amicode.vsix -d /tmp/amicode-vsix-gate
          node packages/extension/scripts/assert_packaged_cli.mjs --bin-dir /tmp/amicode-vsix-gate/extension/bin
      # Pasqal python provisioning gate, artifact lane: the SAME provisioning
      # checks against the connector assets unzipped from the real .vsix — a
      # vsix that shipped a stale/unpinned requirements.txt reds here, on the
      # artifact itself, before any release can carry it.
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: provisioning-gate — the .vsix's connector assets provision a working interpreter (pasqal python provisioning)
        run: node packages/extension/scripts/assert_provisioned_python.mjs --assets-dir /tmp/amicode-vsix-gate/extension/scripts/pasqal-connector
      # The installable artifact: a cross-platform .vsix downloadable from every CI run.
      - name: Upload amicode.vsix
        uses: actions/upload-artifact@v4
        with:
          name: amicode-vsix
          path: packages/extension/amicode.vsix
          if-no-files-found: error
  boot-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]   # linux-x64 + darwin-arm64 — both pins machine-gated (spec §5)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter amicode fetch:opencode
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_FETCH_TOKEN }}   # private-fork release fetch (see fast); one step covers both matrix legs
      - run: pnpm --filter amicode test:smoke
