name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version pinned by packageManager in package.json
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - run: pnpm -r run typecheck
      - run: pnpm -r run test   # amico-run suite (incl. S31 grep rule) + extension unit suite + @amicode/schema conformance
      - name: amico-validate — shipped configs conform (0.1c gate)
        run: |
          V="node packages/schema/dist/amico-validate.js"
          $V packages/extension/scripts/lab.toml.example --schema lab
          $V packages/extension/demo/run/manifest.toml
          $V packages/extension/demo/run/result.toml
          $V packages/extension/demo/run/FINISHED
  boot-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]   # linux-x64 + darwin-arm64 — both pins machine-gated (spec §5)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter amicode-v2 fetch:opencode
      - run: pnpm --filter amicode-v2 test:smoke
