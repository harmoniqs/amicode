name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package and release"
        required: true

concurrency: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  # ── Build binaries from the overlay tree (replaces fork-download) ──────────
  build-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - name: Build native binary (linux-x64)
        run: node packages/extension/scripts/build_binary.mjs
      - name: Cross-compile remaining platforms
        run: |
          for P in linux-arm64 darwin-arm64; do
            node packages/extension/scripts/build_binary.mjs --platform "$P"
          done
      - name: Upload vendor/opencode (all platforms)
        uses: actions/upload-artifact@v7
        with:
          name: opencode-binaries
          path: packages/extension/vendor/opencode/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [build-binary]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
      - name: Resolve tag and publish gate
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          BASE="${TAG#v}"; BASE="${BASE%%-*}"
          PUBLISHABLE=false
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' && PUBLISHABLE=true
          { echo "tag=$TAG"; echo "base=$BASE"; echo "publishable=$PUBLISHABLE"; } >> "$GITHUB_OUTPUT"
      - name: Version guard
        run: |
          MANIFEST="$(node -p "require('./packages/extension/package.json').version")"
          [ "${{ steps.meta.outputs.base }}" = "$MANIFEST" ] \
            || { echo "::error::tag base and extension manifest version differ."; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          name: opencode-binaries
          path: packages/extension/vendor/opencode
      - name: Restore binary permissions
        run: chmod +x packages/extension/vendor/opencode/*/opencode
      - name: Verify the release pin
        run: |
          node - <<'NODE'
          const lock = require('./packages/extension/opencode.lock.json')
          if (!lock.version) throw new Error('release pin must have a version')
          const fs = require('fs')
          const bi = fs.readFileSync('packages/extension/vendor/opencode/linux-x64/.buildinfo', 'utf8')
          const m = bi.match(/^OPENCODE_VERSION=(.+)$/m)
          if (!m || m[1] !== lock.version) throw new Error(`buildinfo version ${m?.[1]} != lock version ${lock.version}`)
          console.log(`Pin verified: lock.version=${lock.version} matches built binary`)
          NODE
      - name: Build extension (build + exemplars + app)
        run: |
          pnpm --filter @amicode/amico-run build
          pnpm --filter amicode run build
          pnpm --filter amicode run build:exemplars
          pnpm --filter amicode run build:app
      - name: Gate check every vendored binary
        run: |
          for P in linux-x64 linux-arm64 darwin-arm64; do
            bash packages/extension/scripts/assert_ui_gate.sh "packages/extension/vendor/opencode/$P/opencode"
          done
      - name: Package universal and platform VSIX files
        id: package
        run: |
          set -euo pipefail
          V=packages/extension/vendor/opencode
          PLATFORMS="linux-x64 linux-arm64 darwin-arm64"
          pnpm --filter amicode exec vsce package --no-dependencies --allow-missing-repository -o amicode.vsix
          AMICODE_REQUIRE_VSIX=1 pnpm --filter amicode exec vitest run test/packaging.test.ts
          for T in $PLATFORMS; do
            for O in $PLATFORMS; do [ "$O" = "$T" ] || mv "$V/$O" "$RUNNER_TEMP/$O"; done
            pnpm --filter amicode exec vsce package --target "$T" --no-dependencies --allow-missing-repository -o "amicode-$T.vsix"
            for O in $PLATFORMS; do [ "$O" = "$T" ] || mv "$RUNNER_TEMP/$O" "$V/$O"; done
          done
          for P in $PLATFORMS; do mv "$V/$P" "$RUNNER_TEMP/cover-$P"; done
          for T in win32-x64 win32-arm64 darwin-x64; do
            pnpm --filter amicode exec vsce package --target "$T" --no-dependencies --allow-missing-repository -o "amicode-$T.vsix"
          done
          for P in $PLATFORMS; do mv "$RUNNER_TEMP/cover-$P" "$V/$P"; done
      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          ASSETS=(packages/extension/amicode.vsix packages/extension/amicode-linux-x64.vsix packages/extension/amicode-linux-arm64.vsix packages/extension/amicode-darwin-arm64.vsix)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${ASSETS[@]}"
          else
            PRERELEASE=""
            case "$TAG" in *-alpha*|*-beta*|*-rc*) PRERELEASE=--prerelease ;; esac
            gh release create "$TAG" --title "amicode $TAG" --generate-notes $PRERELEASE "${ASSETS[@]}"
          fi
      - name: Publish to VS Code Marketplace
        if: ${{ steps.meta.outputs.publishable == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          FAILED=0
          for V in packages/extension/amicode-linux-x64.vsix packages/extension/amicode-linux-arm64.vsix packages/extension/amicode-darwin-arm64.vsix packages/extension/amicode-win32-x64.vsix packages/extension/amicode-win32-arm64.vsix packages/extension/amicode-darwin-x64.vsix; do
            OUTPUT=$(npx --yes @vscode/vsce publish --packagePath "$V" 2>&1) && { echo "$OUTPUT"; continue; }
            echo "$OUTPUT"
            echo "$OUTPUT" | grep -q "already exists" || FAILED=1
          done
          [ "$FAILED" -eq 0 ]
      - name: Publish to Open VSX Registry
        if: ${{ !cancelled() && steps.meta.outputs.publishable == 'true' && steps.package.outcome == 'success' }}
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          FAILED=0
          for V in packages/extension/amicode-linux-x64.vsix packages/extension/amicode-linux-arm64.vsix packages/extension/amicode-darwin-arm64.vsix packages/extension/amicode-win32-x64.vsix packages/extension/amicode-win32-arm64.vsix packages/extension/amicode-darwin-x64.vsix; do
            OUTPUT=$(npx --yes ovsx publish "$V" -p "$OVSX_TOKEN" 2>&1) && { echo "$OUTPUT"; continue; }
            echo "$OUTPUT"
            echo "$OUTPUT" | grep -qiE "already (exists|published)" || FAILED=1
          done
          [ "$FAILED" -eq 0 ]
