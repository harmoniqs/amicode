name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package and release"
        required: true

concurrency: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
      - name: Resolve tag and publish gate
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          BASE="${TAG#v}"; BASE="${BASE%%-*}"
          PUBLISHABLE=false
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' && PUBLISHABLE=true
          { echo "tag=$TAG"; echo "base=$BASE"; echo "publishable=$PUBLISHABLE"; } >> "$GITHUB_OUTPUT"
      - name: Version guard
        run: |
          MANIFEST="$(node -p "require('./packages/extension/package.json').version")"
          [ "${{ steps.meta.outputs.base }}" = "$MANIFEST" ] \
            || { echo "::error::tag base and extension manifest version differ."; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Verify the immutable release pin
        run: |
          node - <<'NODE'
          const lock = require('./packages/extension/opencode.lock.json')
          if (!lock.repo || !lock.tag || !lock.ref) throw new Error('release tag must pin a fork repo, tag, and commit')
          NODE
      - run: pnpm --filter amicode run package
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_FETCH_TOKEN }}
      - name: Vendor every binary from the committed release pin
        run: |
          for P in darwin-arm64 linux-arm64; do
            node packages/extension/scripts/fetch_opencode.mjs --platform "$P" --release
          done
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_FETCH_TOKEN }}
      - name: Gate check every vendored binary
        run: |
          for P in linux-x64 linux-arm64 darwin-arm64; do
            bash packages/extension/scripts/assert_ui_gate.sh "packages/extension/vendor/opencode/$P/opencode"
          done
      - name: Package universal and platform VSIX files
        run: |
          set -euo pipefail
          V=packages/extension/vendor/opencode
          PLATFORMS="linux-x64 linux-arm64 darwin-arm64"
          pnpm --filter amicode exec vsce package --no-dependencies --allow-missing-repository -o amicode.vsix
          AMICODE_REQUIRE_VSIX=1 pnpm --filter amicode exec vitest run test/packaging.test.ts
          for T in $PLATFORMS; do
            for O in $PLATFORMS; do [ "$O" = "$T" ] || mv "$V/$O" "$RUNNER_TEMP/$O"; done
            pnpm --filter amicode exec vsce package --target "$T" --no-dependencies --allow-missing-repository -o "amicode-$T.vsix"
            for O in $PLATFORMS; do [ "$O" = "$T" ] || mv "$RUNNER_TEMP/$O" "$V/$O"; done
          done
          for P in $PLATFORMS; do mv "$V/$P" "$RUNNER_TEMP/cover-$P"; done
          for T in win32-x64 win32-arm64 darwin-x64; do
            pnpm --filter amicode exec vsce package --target "$T" --no-dependencies --allow-missing-repository -o "amicode-$T.vsix"
          done
          for P in $PLATFORMS; do mv "$RUNNER_TEMP/cover-$P" "$V/$P"; done
      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          ASSETS=(packages/extension/amicode.vsix packages/extension/amicode-linux-x64.vsix packages/extension/amicode-linux-arm64.vsix packages/extension/amicode-darwin-arm64.vsix)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${ASSETS[@]}"
          else
            PRERELEASE=""
            case "$TAG" in *-alpha*|*-beta*|*-rc*) PRERELEASE=--prerelease ;; esac
            gh release create "$TAG" --title "amicode $TAG" --generate-notes $PRERELEASE "${ASSETS[@]}"
          fi
      - name: Publish to VS Code Marketplace
        if: ${{ steps.meta.outputs.publishable == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          FAILED=0
          for V in packages/extension/amicode-linux-x64.vsix packages/extension/amicode-linux-arm64.vsix packages/extension/amicode-darwin-arm64.vsix packages/extension/amicode-win32-x64.vsix packages/extension/amicode-win32-arm64.vsix packages/extension/amicode-darwin-x64.vsix; do
            OUTPUT=$(npx --yes @vscode/vsce publish --packagePath "$V" 2>&1) && { echo "$OUTPUT"; continue; }
            echo "$OUTPUT"
            echo "$OUTPUT" | grep -q "already exists" || FAILED=1
          done
          [ "$FAILED" -eq 0 ]
