# The research mode bundle manifest — ONE unit (spec-20260905-063000 D1).
# Same contract as modes/develop/mode.toml: ONE shared validator enforces the
# pack schema and the declared set. Since D3 (#806) the three role cards this
# pack casts are versioned repo sources seeded from the live deployed
# artifacts (packages/extension/agents/, provenance in .seed-provenance.json
# beside them) — owned by THIS bundle, staged and digest-verified with the
# director card. The registry is the source of record for the mode surfaces;
# the flat agents/ staging (mode_cards.ts) remains opencode's discovery path.
schema_version = "1"
mode = "research"
# The agent id that BINDS this mode (D4 posture-binding map, #808): a session
# resolved to this agent runs the research director posture; every other
# agent id (plan, build, role agents, custom) binds copilot and is silent.
agent = "research"
card = "card.md"
pack = "pack.toml"

# Declared roles — the research pack casts the hypothesizer/experimenter/
# analyzer trio, one phase each. Seeded from the deployed staging artifacts
# (D3, #806); content parity against the engine-neutral vault definitions is
# seed-gated on Aaron's signature — see docs/seed-gate/role-cards-seed-diff.md.
protocol_skills = [
  "director-core",
  "research",
  "hypothesis-review",
  "structural-analysis",
]

[[roles]]
name = "hypothesizer"
path = "../../agents/hypothesizer.md"

[[roles]]
name = "experimenter"
path = "../../agents/experimenter.md"

[[roles]]
name = "analyzer"
path = "../../agents/analyzer.md"

# The mode's protocol skills (the binding surface). director-core is PUBLIC
# with an in-repo canonical copy under packages/extension/skills/ (#807, D2,
# ADR-0011 amendment: workflow public, package-proprietary gated);
# hypothesis-review likewise ships publicly; structural-analysis remains a
# team-vault copy on machines that sync it (honest degradation names it).

# The handoff seed this mode RECEIVES: dev closes with a hypothesis seed and
# hands it to research (D6).
[[handoff_seeds]]
kind = "hypothesis_seed"
schema = "../../handoff-seeds/hypothesis-seed.schema.json"

[consumer_floors]
doctor = "1"
plugin = "1"
stager = "1"
tests = "1"
