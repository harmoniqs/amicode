# In-repo exemplar seed (spec C tier 2). Each entry: a curated solve script the
# resolver can splice a Problem's params into (single-exemplar composition only
# in v1 — cross-exemplar = tier 3). build_exemplars.mjs aggregates this file ∪
# any $AMICODE_DEMOS_ROOT/*/EXEMPLARS.toml, copies external scripts in-tree,
# computes a masked baseline_hash per entry, and writes exemplars/index.json
# (the artifact amico-run reads — this .toml is the build input, not the index).

[[exemplar]]
id = "rydberg-cz"
platform = "rydberg"
kind = "gate_synthesis"
size = 2
path = "rydberg-cz/script.jl"      # relative to this file's dir
packages = ["Piccolo", "CairoMakie", "JLD2", "LinearAlgebra", "TOML", "Printf"]
notes = "EXPERIMENTAL exemplar — the NLP's first iteration is pathologically slow at this size in the current Piccolo path (see the script header); splice params but expect long solves until vetted."
