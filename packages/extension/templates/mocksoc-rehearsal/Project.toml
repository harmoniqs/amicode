# The MockSoc rehearsal env (SEAM 1, amicode #680) — resolved from the General
# registry, NOT the provisioned solve env (packages/extension/julia, Piccolo
# ~1.19): the rehearsal rides Strumento's transport stack, which needs Piccolo
# 2.x for its MockSoc extension.
#
#   Strumento 0.3  — the soc substrate: AbstractSoc + MockSoc (its Piccolo
#                    extension) + the QICK envelope translation
#   Intonato ≥ 0.4 — the loop chassis with the absorbed hardware seam
#                    (StrumentoBackend / StrumentoExperiment / PulseTuningProblem)
#   Piccolo 2.x    — the physics stack; pins the env to the 2.x line
#
# The Piccolo bound is load-bearing: without it the resolver picks Intonato
# 0.3.x + Piccolo 1.x (measured: unbound `Pkg.add("Intonato")` resolves
# Intonato 0.3.1 + Piccolo 1.19.0, which carries NO absorbed hardware seam).
# A rehearsal env that will not resolve ships nothing (F1) — bump these bounds
# deliberately, with the rehearsal re-run green, never in passing.
#
# Instantiate once:  julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
# Then (always):     julia --startup-file=no --project=. ../mocksoc_rehearsal.jl …

[deps]
Intonato = "4c8581c7-0eaf-45eb-b8fa-a3474c50779c"
Piccolo = "c4671d76-df94-11ed-2057-43d4fd632fad"
Strumento = "9a96c2ab-728f-48d1-a688-c746ce4d362f"

[compat]
Intonato = "0.4"
Piccolo = "~2.1"
Strumento = "0.3"
julia = "1.12"
