# Template registry (spec C tier 1) — shape key (platform × kind × size) → a
# vetted solve template. `status` gates tier-1 eligibility: ONLY status="vetted"
# entries resolve as tier 1; "experimental" entries are recorded for provenance
# but never selected (amico-run resolve skips them → the shape falls to tier 2/3).
# `packages` drives the entitlement check + sandbox generation; `entitlement`
# (optional) names the entitlement a gated template requires.

verify_tolerance = 0.001   # tier-3 re-rollout agreement (absolute; spec-20260704-113005 §6 — resolves spec-C open q1)

[[template]]
id = "transmon-gate-1q"
platform = "transmon"
kind = "gate_synthesis"
size = 1
path = "solve_template.jl"          # relative to this file's dir (packages/extension/templates/)
status = "vetted"
packages = ["Piccolo", "CairoMakie", "JLD2", "TOML", "Printf"]

[[template]]
id = "rydberg-cz-2q"
platform = "rydberg"
kind = "gate_synthesis"
size = 2
path = "solve_rydberg_cz.jl"
status = "experimental"             # header: "⚠️ NOT YET VETTED" — NOT tier-1 eligible
packages = ["Piccolo", "CairoMakie", "JLD2", "LinearAlgebra", "TOML", "Printf"]

# Fixed support set — packages the run-dir contract itself requires (JLD2 for
# pulse.jld2, CairoMakie for iter_<N>.png) plus common numeric stdlibs. The
# import scan allows (entitlement allowlist ∪ this set ∪ Julia stdlibs); without
# it the scan would block the vetted template's OWN launch.
[support]
packages = ["JLD2", "CairoMakie", "Makie", "TOML", "Printf", "LinearAlgebra", "Random", "Statistics", "SparseArrays"]

