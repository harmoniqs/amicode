[compat]
# Raised 2.1 -> 2.2 in amicode#2180: the vetted pulse-designer template's version
# probe requires Piccolo >= 2.2 / DirectTrajOpt >= 0.11 (the MadNLP-default flip)
# / NamedTrajectories >= 0.9.4 and refuses to run on anything older. MadNLP is a
# direct dep because the template `import MadNLP`s for its raw user callback; its
# minor is whatever DTO 0.11 admits. History: ~1.19 -> 2.1 in amicode#540 (six
# family gates re-vetted at F > 0.999). The bounds are explicit per package so a
# Pkg.update can never silently move a minor; test/julia_env_pins.test.ts checks
# them against the template's floor.
julia = "1.11"
CairoMakie = "0.15"
JLD2 = "0.6"
DirectTrajOpt = "0.11"
MadNLP = "0.9"
NamedTrajectories = "0.9.4"
Piccolo = "2.2"
