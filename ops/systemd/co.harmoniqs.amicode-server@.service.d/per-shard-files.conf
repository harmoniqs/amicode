# 2026-10-15: the pid + handshake files are PER-SHARD. The default paths are
# global — every shard's runner wrote the same hub-engine.pid, and the
# adopt-or-spawn logic read the other shard's pid from it and SIGTERM'd the
# "foreign orphan" engine: a three-way killing ground during restart storms
# (shard 3 crash-looped to counter 96 while its engine booted healthy every
# time — the logs read "engine up ... FAIL: engine exited (SIGTERM)" in
# 12-second cycles).
[Service]
Environment=AMICODE_HUB_PID_FILE=%h/.amico/amicode/hub-engine-shard%i.pid
Environment=AMICODE_HUB_HANDSHAKE=%h/.amico/ops/server/standalone-shard%i.json
